<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | Fees & Admit Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-xl overflow-hidden">
        
        <div class="bg-blue-800 p-6 text-center text-white">
            <h1 class="text-2xl font-bold tracking-wide">Student Portal</h1>
            <div id="loadingBox" class="flex justify-center items-center mt-2">
                <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-blue-200" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="text-blue-200 text-sm" id="loadingText">Loading student database...</p>
            </div>
        </div>

        <div id="mainContent" class="opacity-50 pointer-events-none transition-opacity duration-300">
            <div class="flex border-b">
                <button onclick="switchTab('pay')" id="tab-pay" class="w-1/2 py-4 font-semibold text-blue-800 border-b-2 border-blue-800">Submit Payment</button>
                <button onclick="switchTab('download')" id="tab-download" class="w-1/2 py-4 font-semibold text-gray-500 border-b-2 border-transparent">Download Admit</button>
            </div>

            <div class="p-8">
                <div id="section-pay" class="block">
                    <form id="paymentForm" class="space-y-5">
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Select Class</label>
                                <select id="classSelect" required onchange="filterStudents()" class="mt-1 w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-800 outline-none bg-white">
                                    <option value="" disabled selected>Select Class first</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Select Student</label>
                                <select id="studentSelect" required onchange="updatePaymentZone()" disabled class="mt-1 w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-800 outline-none bg-gray-50 disabled:opacity-50">
                                    <option value="" disabled selected>Select Student Name</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Guardian WhatsApp No.</label>
                                <input type="tel" id="guardianPhone" required pattern="[0-9]{10}" placeholder="10-digit number" class="mt-1 w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-800 outline-none bg-white">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Fee Month / Purpose</label>
                                <select id="feeMonth" required onchange="updatePaymentZone()" class="mt-1 w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-800 outline-none bg-white">
                                    <option value="" disabled selected>Select Month</option>
                                    <option value="January">January</option>
                                    <option value="February">February</option>
                                    <option value="March">March</option>
                                    <option value="April">April</option>
                                    <option value="May">May</option>
                                    <option value="June">June</option>
                                    <option value="July">July</option>
                                    <option value="August">August</option>
                                    <option value="September">September</option>
                                    <option value="October">October</option>
                                    <option value="November">November</option>
                                    <option value="December">December</option>
                                    <option value="Others">Others / Arrears</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4 bg-gray-50 p-4 rounded-lg border">
                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider">Student ID</label>
                                <input type="text" id="displayId" readonly class="mt-1 w-full bg-transparent font-semibold text-gray-800 outline-none" placeholder="Auto-filled">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider">Fee Amount</label>
                                <div class="flex items-center mt-1">
                                    <span class="text-gray-800 font-bold mr-1">₹</span>
                                    <input type="text" id="displayAmount" readonly class="w-full bg-transparent font-bold text-blue-800 outline-none" placeholder="Auto-filled">
                                </div>
                            </div>
                        </div>

                        <div id="dynamicPaymentZone" class="hidden mt-4 text-center bg-blue-50 p-6 rounded-xl border border-blue-100">
                            <h3 class="text-blue-900 font-bold mb-3">Scan & Pay Exact Fee</h3>
                            <img id="qrImage" src="" alt="QR Code" class="mx-auto w-40 h-40 border-2 border-white rounded-lg shadow-md mb-4">
                            
                            <a id="upiIntentBtn" href="#" class="inline-block w-full bg-green-600 text-white font-bold py-3 rounded-lg shadow hover:bg-green-700 transition md:hidden mb-2">
                                Pay Now via UPI App
                            </a>
                            <p class="text-xs text-gray-500">Scan QR or click the button on mobile to pay safely.</p>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700">Upload Payment Screenshot</label>
                            <input type="file" id="screenshotFile" accept="image/*" required class="mt-1 w-full p-2 border rounded-lg text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700">
                        </div>

                        <button type="submit" id="submitBtn" class="w-full flex justify-center items-center bg-blue-800 text-white font-bold py-3 rounded-lg hover:bg-blue-900 transition mt-2 disabled:opacity-75 disabled:cursor-not-allowed">
                            <svg id="submitSpinner" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span id="submitBtnText">Submit Verification Request</span>
                        </button>
                        
                        <div id="payMessage" class="hidden mt-4 p-4 bg-green-50 border border-green-200 rounded-lg text-center"></div>
                    </form>
                </div>

                <div id="section-download" class="hidden">
                    <div class="text-center mb-6">
                        <p class="text-sm text-gray-600">Enter your Student ID <span class="font-bold">or</span> Phone Number to check status.</p>
                    </div>
                    <div class="space-y-4">
                        <input type="text" id="checkSearchKey" placeholder="e.g. S101 or 9876543210" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-800 outline-none">
                        
                        <button onclick="checkStatus()" id="checkBtn" class="w-full flex justify-center items-center bg-gray-800 text-white font-bold py-3 rounded-lg hover:bg-gray-900 transition disabled:opacity-75 disabled:cursor-not-allowed">
                            <svg id="checkSpinner" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span id="checkBtnText">Check Status</span>
                        </button>

                        <div id="resultArea" class="mt-6 p-4 rounded-lg hidden text-center border">
                            <p id="resultStatus" class="font-bold text-lg"></p>
                            <div id="resultDesc" class="text-sm mt-2 text-gray-700"></div>
                            <a id="downloadLink" href="#" target="_blank" class="hidden inline-block mt-4 px-6 py-2 bg-green-600 text-white font-semibold rounded shadow hover:bg-green-700 transition">Download Admit Card PDF</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxsmxuCjBA6hGpCobH0DYmlPHroIh0LfaDktmCuwqq8oq09yaZsmN89cVzi8LqHK_qoyQ/exec"; 
        const MERCHANT_UPI_ID = "Q882733546@ybl"; 
        const MERCHANT_NAME = "AL-A'RAF MISSION";     
        const ADMIN_PHONE = "+919876543210"; 

        let masterStudentList = [];
        let countdownTimer; 

        window.onload = async function() {
            try {
                const response = await fetch(`${WEB_APP_URL}?action=getStudents`);
                const result = await response.json();
                
                if (result.status === "success") {
                    masterStudentList = result.data;
                    const classes = [...new Set(masterStudentList.map(item => item.classLevel))];
                    const classSelect = document.getElementById('classSelect');
                    
                    classes.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c;
                        opt.textContent = c;
                        classSelect.appendChild(opt);
                    });

                    document.getElementById('loadingBox').innerHTML = '<p class="text-blue-200 text-sm">Submit Fees & Download Admit Card</p>';
                    document.getElementById('mainContent').classList.remove('opacity-50', 'pointer-events-none');
                }
            } catch(e) {
                document.getElementById('loadingBox').innerHTML = '<p class="text-red-200 text-sm font-bold">Error loading database. Please refresh.</p>';
            }
        };

        function filterStudents() {
            const selectedClass = document.getElementById('classSelect').value;
            const studentSelect = document.getElementById('studentSelect');
            
            studentSelect.innerHTML = '<option value="" disabled selected>Select Student Name</option>';
            document.getElementById('displayId').value = "";
            document.getElementById('displayAmount').value = "";
            document.getElementById('dynamicPaymentZone').classList.add('hidden');
            
            const filtered = masterStudentList.filter(s => s.classLevel === selectedClass);
            filtered.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id; 
                opt.textContent = s.name;
                studentSelect.appendChild(opt);
            });
            
            studentSelect.disabled = false;
            studentSelect.classList.remove('bg-gray-50');
            updatePaymentZone(); 
        }

        // --- NEW: SMART PAID/PENDING MONTHS WITH ICONS ---
        function updatePaymentZone() {
            const selectedId = document.getElementById('studentSelect').value;
            const monthSelect = document.getElementById('feeMonth');
            const selectedMonth = monthSelect.value;
            
            if(!selectedId) return; 
            
            const student = masterStudentList.find(s => s.id.toString() === selectedId.toString());
            
            if(student) {
                // 1. Reset the dropdown options to default clean text and styling
                Array.from(monthSelect.options).forEach(opt => {
                    if (opt.value !== "") {
                        opt.disabled = false;
                        opt.text = opt.value; // Reset text
                        opt.style.color = ""; // Reset text color
                        opt.style.backgroundColor = ""; // Reset background
                    }
                });

                // 2. Disable months with icons and colors
                let attemptedDuplicate = false;
                if (student.paidMonths && Object.keys(student.paidMonths).length > 0) {
                    Array.from(monthSelect.options).forEach(opt => {
                        const monthStatus = student.paidMonths[opt.value];
                        
                        if (monthStatus) {
                            opt.disabled = true;
                            // Inject emojis and styles based on status
                            if (monthStatus === "Verified") {
                                opt.text = `✅ ${opt.value} (Verified)`;
                                opt.style.color = "#15803d"; // Dark Green
                                opt.style.backgroundColor = "#f0fdf4"; // Light Green BG
                            } else {
                                opt.text = `⏳ ${opt.value} (Pending)`;
                                opt.style.color = "#b45309"; // Dark Orange
                                opt.style.backgroundColor = "#fffbeb"; // Light Orange BG
                            }
                            
                            if (opt.value === selectedMonth) {
                                attemptedDuplicate = true;
                            }
                        }
                    });
                }

                // 3. Stop them if they selected a duplicate
                if (attemptedDuplicate) {
                    monthSelect.value = ""; 
                    document.getElementById('dynamicPaymentZone').classList.add('hidden');
                    alert("This student has already paid (or is pending verification) for that month. Please select a different fee purpose.");
                    return; 
                }

                // 4. Fill in display fields
                document.getElementById('displayId').value = student.id;
                document.getElementById('displayAmount').value = student.fee;
                
                // 5. Generate QR
                if (monthSelect.value !== "") {
                    const monthText = monthSelect.value;
                    const paymentNote = `${monthText}: ${student.name} | ID: ${student.id} | ${student.classLevel}`;
                    const upiString = `upi://pay?pa=${MERCHANT_UPI_ID}&pn=${encodeURIComponent(MERCHANT_NAME)}&am=${student.fee}&tn=${encodeURIComponent(paymentNote)}&cu=INR`;
                    
                    document.getElementById('upiIntentBtn').href = upiString;
                    document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(upiString)}`;
                    document.getElementById('dynamicPaymentZone').classList.remove('hidden');
                } else {
                    document.getElementById('dynamicPaymentZone').classList.add('hidden');
                }
            }
        }

        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('screenshotFile');
            const studentId = document.getElementById('displayId').value;
            
            if (!studentId) return alert("Please select a student.");
            if (fileInput.files.length === 0) return alert("Upload screenshot.");

            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('submitBtnText');
            const spinner = document.getElementById('submitSpinner');
            const msg = document.getElementById('payMessage');
            
            btn.disabled = true;
            spinner.classList.remove('hidden');
            btnText.innerText = "Uploading & Submitting...";

            const studentSelect = document.getElementById('studentSelect');
            const studentName = studentSelect.options[studentSelect.selectedIndex].text;
            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function(event) {
                const base64Data = event.target.result.split(',')[1];
                const selectedMonth = document.getElementById('feeMonth').value;
                
                const payload = {
                    studentId: studentId,
                    studentName: studentName,
                    phone: document.getElementById('guardianPhone').value, 
                    classLevel: document.getElementById('classSelect').value,
                    feeMonth: selectedMonth,
                    amount: document.getElementById('displayAmount').value,
                    fileName: file.name,
                    mimeType: file.type,
                    fileBase64: base64Data
                };

                try {
                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' }, 
                        body: JSON.stringify(payload)
                    });
                    
                    // Immediately lock it locally as pending
                    const student = masterStudentList.find(s => s.id.toString() === studentId.toString());
                    if (student) { 
                        if (!student.paidMonths) student.paidMonths = {};
                        student.paidMonths[selectedMonth] = 'Pending'; 
                    }

                    spinner.classList.add('hidden');
                    btnText.innerText = "Submitted Successfully!";
                    
                    msg.innerHTML = `<p class="font-bold text-green-700">Payment Submitted!</p>
                                     <p class="text-sm text-green-600 mt-1">Payment is under processing.<br>Please visit again after <strong>1 hour</strong> to download your admit card.</p>`;
                    msg.classList.remove('hidden');
                    
                    setTimeout(() => {
                        document.getElementById('paymentForm').reset();
                        document.getElementById('displayId').value = "";
                        document.getElementById('displayAmount').value = "";
                        document.getElementById('dynamicPaymentZone').classList.add('hidden');
                        document.getElementById('studentSelect').disabled = true;
                        msg.classList.add('hidden');
                        btnText.innerText = "Submit Verification Request";
                        btn.disabled = false;
                        updatePaymentZone(); 
                    }, 5000);

                } catch (err) {
                    spinner.classList.add('hidden');
                    btnText.innerText = "Submit Verification Request";
                    btn.disabled = false;
                    msg.innerHTML = "<p class='font-bold text-red-600'>Error submitting. Please check connection.</p>";
                    msg.classList.remove('hidden', 'bg-green-50', 'border-green-200');
                    msg.classList.add('bg-red-50', 'border-red-200');
                }
            };
            reader.readAsDataURL(file);
        });

        async function checkStatus() {
            const searchKey = document.getElementById('checkSearchKey').value.trim();
            if(!searchKey) return alert("Enter Student ID or Phone Number");
            
            const btn = document.getElementById('checkBtn');
            const btnText = document.getElementById('checkBtnText');
            const spinner = document.getElementById('checkSpinner');
            const resultArea = document.getElementById('resultArea');
            
            clearInterval(countdownTimer);

            btn.disabled = true;
            spinner.classList.remove('hidden');
            btnText.innerText = "Checking Database...";
            
            resultArea.classList.add('hidden');
            document.getElementById('downloadLink').classList.add('hidden');
            
            try {
                const response = await fetch(`${WEB_APP_URL}?action=checkStatus&searchKey=${encodeURIComponent(searchKey)}`);
                const data = await response.json();
                resultArea.classList.remove('hidden');

                if (data.status === "not_found") {
                    resultArea.className = "mt-6 p-4 rounded-lg border bg-red-50 text-red-700";
                    document.getElementById('resultStatus').textContent = "Not Found";
                    document.getElementById('resultDesc').innerHTML = "No payment submission found for this ID or Phone Number.";
                
                } else if (data.paymentStatus === "Pending") {
                    const submitTime = new Date(data.timestamp).getTime();
                    const targetTime = submitTime + (60 * 60 * 1000); 
                    const now = new Date().getTime();
                    const timeDifference = targetTime - now;

                    if (timeDifference <= 0) {
                        resultArea.className = "mt-6 p-4 rounded-lg border bg-orange-50 border-orange-200";
                        document.getElementById('resultStatus').textContent = "Verification Delayed";
                        document.getElementById('resultStatus').className = "font-bold text-lg text-orange-700";
                        document.getElementById('resultDesc').innerHTML = `
                            <p class="text-sm text-gray-700 mb-4">It has been over an hour since submission. Please contact the admin for immediate assistance.</p>
                            <div class="flex justify-center gap-3">
                                <a href="tel:${ADMIN_PHONE}" class="flex items-center px-4 py-2 bg-blue-600 text-white text-sm font-semibold rounded-lg shadow hover:bg-blue-700 transition">📞 Call</a>
                                <a href="https://wa.me/${ADMIN_PHONE.replace('+', '')}" target="_blank" class="flex items-center px-4 py-2 bg-green-500 text-white text-sm font-semibold rounded-lg shadow hover:bg-green-600 transition">💬 WhatsApp</a>
                            </div>
                        `;
                    } else {
                        resultArea.className = "mt-6 p-4 rounded-lg border bg-yellow-50 text-yellow-700";
                        document.getElementById('resultStatus').textContent = "Pending Verification";
                        document.getElementById('resultStatus').className = "font-bold text-lg text-yellow-700";
                        
                        document.getElementById('resultDesc').innerHTML = `
                            <p class="text-sm text-gray-700 mb-2">Payment is under processing in the mission/institution.</p>
                            <div class="mt-3 p-3 bg-yellow-100/50 rounded-lg border border-yellow-200 flex flex-col items-center">
                                <p class="text-xs font-semibold text-yellow-800 uppercase tracking-wide mb-1">Estimated Wait Time</p>
                                <div id="countdownClock" class="text-yellow-800 font-medium tabular-nums text-lg flex items-center">
                                    <svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-yellow-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                    </svg>
                                    Calculating...
                                </div>
                            </div>
                        `;

                        countdownTimer = setInterval(function() {
                            const currentTime = new Date().getTime();
                            const distance = targetTime - currentTime;

                            if (distance < 0) {
                                clearInterval(countdownTimer);
                                document.getElementById('countdownClock').innerHTML = "Time is up! Please click 'Check Status' again.";
                                return;
                            }

                            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                            const s = Math.floor((distance % (1000 * 60)) / 1000);
                            const displaySeconds = s < 10 ? "0" + s : s;

                            document.getElementById('countdownClock').innerHTML = `
                                <svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-yellow-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                                <span class="font-bold text-2xl">${m}</span>m <span class="font-bold text-2xl">${displaySeconds}</span>s
                            `;
                        }, 1000);
                    }

                } else if (data.paymentStatus === "Verified") {
                    resultArea.className = "mt-6 p-4 rounded-lg border bg-green-50 text-green-700 flex flex-col items-center";
                    document.getElementById('resultStatus').innerHTML = `
                        <div class="flex items-center justify-center">
                            <svg class="w-6 h-6 mr-2 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Verified!
                        </div>
                    `;
                    document.getElementById('resultStatus').className = "font-bold text-lg text-green-700 w-full text-center";
                    document.getElementById('resultDesc').innerHTML = "Your admit card is ready.";
                    if (data.admitUrl) {
                        const link = document.getElementById('downloadLink');
                        link.href = data.admitUrl;
                        link.classList.remove('hidden');
                    }
                }
            } catch (err) { 
                alert("Error connecting to server. Please try again."); 
            } finally { 
                spinner.classList.add('hidden');
                btnText.innerText = "Check Status";
                btn.disabled = false; 
            }
        }

        function switchTab(tab) {
            document.getElementById('section-pay').classList.toggle('hidden', tab !== 'pay');
            document.getElementById('section-download').classList.toggle('hidden', tab !== 'download');
            document.getElementById('tab-pay').className = tab === 'pay' ? 'w-1/2 py-4 font-semibold text-blue-800 border-b-2 border-blue-800' : 'w-1/2 py-4 font-semibold text-gray-500 border-b-2 border-transparent';
            document.getElementById('tab-download').className = tab === 'download' ? 'w-1/2 py-4 font-semibold text-blue-800 border-b-2 border-blue-800' : 'w-1/2 py-4 font-semibold text-gray-500 border-b-2 border-transparent';
            clearInterval(countdownTimer);
        }
    </script>
</body>
</html>
